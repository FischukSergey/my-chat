name: my-chat-prod

x-labels: &common-labels
  labels:
    com.my-chat.project: my-chat
    com.my-chat.env: prod

x-restart: &restart
  restart: unless-stopped

x-depends-postgres: &depends-postgres
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    container_name: my-chat-postgres-prod
    <<: [*common-labels, *restart]
    env_file: ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - my-chat-net

  main-service:
    build:
      context: ../../
      dockerfile: prod.Dockerfile
    container_name: my-chat-main-service-prod
    <<: [*common-labels, *restart, *depends-postgres]
    command: ["-config", "configs/config.main-service.prod.yaml"]
    env_file: ../../.env
    environment:
      # VAPID public key для endpoint GET /api/v1/push/vapid-public-key
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - my-chat-net

  auth-proxy:
    build:
      context: ../../
      dockerfile: auth-proxy.Dockerfile
    container_name: my-chat-auth-proxy-prod
    <<: [*common-labels, *restart, *depends-postgres]
    command: ["-config", "configs/config.auth-proxy.prod.yaml"]
    env_file: ../../.env
    # Проверяем что HTTP-сервер отвечает: wget вернёт 8 (4xx/5xx) — не 4 (сеть недоступна)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --timeout=3 http://localhost:33081/ 2>&1; [ $? -ne 4 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - my-chat-net

  notification-worker:
    build:
      context: ../../
      dockerfile: notification-worker.Dockerfile
    container_name: my-chat-notification-worker-prod
    <<: [*common-labels, *restart, *depends-postgres]
    command: ["-config", "configs/config.notification-worker.prod.yaml"]
    env_file: ../../.env
    environment:
      # VAPID ключи для Web Push провайдера
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    # Pure worker — нет HTTP-сервера, проверяем что процесс жив
    healthcheck:
      test: ["CMD", "test", "-f", "/proc/1/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - my-chat-net

  message-expirer:
    build:
      context: ../../
      dockerfile: message-expirer.Dockerfile
    container_name: my-chat-message-expirer-prod
    <<: [*common-labels, *restart, *depends-postgres]
    command: ["-config", "configs/config.message-expirer.prod.yaml"]
    env_file: ../../.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9101/metrics 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - my-chat-net

  nginx:
    image: nginx:1.27-alpine
    container_name: my-chat-nginx-prod
    <<: [*common-labels, *restart]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      main-service:
        condition: service_healthy
      auth-proxy:
        condition: service_started
    networks:
      - my-chat-net

  certbot:
    image: certbot/certbot:latest
    container_name: my-chat-certbot-prod
    <<: *common-labels
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - my-chat-net

  # Перезагружает nginx каждые 12 часов после того, как certbot обновил сертификат
  nginx-reloader:
    image: docker:cli
    container_name: my-chat-nginx-reloader-prod
    <<: [*common-labels, *restart]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      /bin/sh -c "while :; do
        sleep 12h;
        docker exec my-chat-nginx-prod nginx -s reload && echo 'nginx reloaded' || echo 'nginx reload failed';
      done"
    depends_on:
      - nginx

networks:
  my-chat-net:
    driver: bridge

volumes:
  postgres-data:
    name: my-chat-postgres-data-prod
