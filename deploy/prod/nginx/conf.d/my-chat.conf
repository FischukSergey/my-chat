# ─── HTTP: перенаправить всё на HTTPS, кроме certbot challenge ───────────────
server {
    listen 80;
    server_name beepru.ru;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name beepru.ru;

    # SSL-сертификаты (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/beepru.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beepru.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/beepru.ru/chain.pem;

    # Современный SSL
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Docker DNS — динамический резолвинг upstream-ов
    # (без этого nginx кэширует IP при старте; при рестарте сервиса адрес устаревает)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Общие proxy-заголовки
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # ── Auth API (same-origin PWA: /api/v1/auth/* → auth-proxy) ───────────────
    # Должен быть до location /api/, иначе main-service получит auth-запросы.
    location /api/v1/auth/ {
        set $upstream_auth http://auth-proxy:33081;
        proxy_pass $upstream_auth;

        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
        proxy_connect_timeout 5s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        set $upstream_main http://main-service:8080;
        proxy_pass $upstream_main;

        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws/ {
        set $upstream_main http://main-service:8080;
        proxy_pass $upstream_main;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Долгое соединение для WS
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 5s;
    }

    # ── Auth proxy ────────────────────────────────────────────────────────────
    # Обрезаем префикс /auth: /auth/api/v1/... → /api/v1/...
    # ВАЖНО: set обязан стоять ДО rewrite, т.к. rewrite+break прерывает
    # выполнение директив ngx_http_rewrite_module (к которым set относится).
    location /auth/ {
        set $upstream_auth http://auth-proxy:33081;
        rewrite ^/auth/(.*) /$1 break;
        proxy_pass $upstream_auth;

        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
        proxy_connect_timeout 5s;
    }

    # ── Health ────────────────────────────────────────────────────────────────
    location = /health {
        set $upstream_main http://main-service:8080;
        proxy_pass $upstream_main;

        access_log off;
    }

    # ── PWA (статика из mobile/dist, собрана в образ nginx) ───────────────────
    # Service Worker нельзя кэшировать агрессивно — иначе клиенты не получат обновления.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
