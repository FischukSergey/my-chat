name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Ручной деплой (когда auto-CI по push не сработал или нужен re-deploy)
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # workflow_run → только после успешного CI; workflow_dispatch → всегда
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/my-chat

            echo "==> git pull"
            git pull origin main

            echo "==> docker compose build"
            docker compose -f deploy/prod/docker-compose.prod.yml --env-file .env build --no-cache

            echo "==> docker compose up"
            docker compose -f deploy/prod/docker-compose.prod.yml --env-file .env up -d --remove-orphans

            echo "==> nginx reload (конфиг монтируется как volume, нужен явный reload)"
            docker exec my-chat-nginx-prod nginx -s reload

            echo "==> docker image prune"
            docker image prune -f

            echo "==> Deploy done"
