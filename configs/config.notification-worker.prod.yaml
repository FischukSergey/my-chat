global:
  env: prod

log:
  level: info
  format: json
  service_name: notification-worker

database:
  dsn: ${DATABASE_DSN}
  auto_migrate: false

notification_worker:
  poll_interval_seconds: 5
  batch_size: 20
  max_attempts: 5
  backoff_base_seconds: 30
  provider: webpush
  outbox_retention_seconds: 604800
  web_push:
    vapid_private_key: ${VAPID_PRIVATE_KEY}
    vapid_public_key: ${VAPID_PUBLIC_KEY}
    subject: ${VAPID_SUBJECT}
