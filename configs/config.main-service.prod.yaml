global:
  env: prod

log:
  level: info
  format: json
  service_name: main-service

servers:
  client:
    addr: 0.0.0.0:8080
  metrics:
    addr: 0.0.0.0:9100

database:
  dsn: ${DATABASE_DSN}
  auto_migrate: true

jwt:
  secret: ${JWT_SECRET}
  access_token_ttl_seconds: 900
  refresh_token_ttl_seconds: 604800

chat:
  message_ttl_seconds: 60

cors:
  allowed_origins:
    - https://beepru.ru

# VAPID public key для endpoint GET /api/v1/push/vapid-public-key.
# Значение берётся из переменной окружения VAPID_PUBLIC_KEY (устанавливается через .env).
notification_worker:
  web_push:
    vapid_public_key: ${VAPID_PUBLIC_KEY}
